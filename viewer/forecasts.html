<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>How good are the forecasts? · takt-twin</title>
    <script>
      // same theme as the console, before the first paint (src/theme.ts)
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("sbb-twin-theme");
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/forecasts/main.tsx"></script>
  </body>
</html>
