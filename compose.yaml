services:
  sbb-twin:
    build: .
    # no ports published on the host: put a reverse proxy in front (it reaches the container's :8787 on the compose network)
    environment:
      OTD_GTFS_RT_KEY: ${OTD_GTFS_RT_KEY:-} # opentransportdata.swiss key for GTFS-RT (optional)
    restart: unless-stopped
